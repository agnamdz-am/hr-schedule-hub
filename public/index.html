<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Schedule Hub</title>
  <meta name="description" content="Penjadwalan interview, training, dan cuti untuk tim HR PT Gna Ascend Indonesia (data fiktif).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e5c58'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h8' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <section id="login" class="loginwrap" hidden>
    <div class="logincard panel">
      <div class="brand">
        <span class="mark" aria-hidden="true">GA</span>
        <div><b>HR Schedule Hub</b><small>PT Gna Ascend Indonesia · data fiktif untuk demo</small></div>
      </div>
      <h1>Masuk</h1>
      <form id="loginform" class="form">
        <label class="field"><span>Email</span><input id="email" type="email" autocomplete="username" required></label>
        <label class="field"><span>Kata sandi</span><input id="password" type="password" autocomplete="current-password" required></label>
        <div id="login-error" role="alert"></div>
        <button class="btn primary" type="submit" id="login-btn">Masuk</button>
      </form>
      <div id="demo-box" hidden>
        <h2>Akun demo</h2>
        <p class="muted" style="margin:2px 0 8px;font-size:13.5px">Klik salah satu untuk mengisi form. Kata sandi semua akun: <code class="mono" id="demo-pass"></code></p>
        <div id="demo-list" class="demo-list"></div>
      </div>
    </div>
  </section>

  <div id="app" hidden>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">GA</span>
        <div><b>HR Schedule Hub</b><small>PT Gna Ascend Indonesia · data fiktif untuk demo</small></div>
      </div>
      <div class="who"><span class="name" id="whoami"></span><button class="btn sm" id="logout" type="button">Keluar</button></div>
    </header>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Menu utama"></nav>
    <main id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle" id="modal"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/logic.js"></script>
<script src="/app.js"></script>
</body>
</html>
